# mbple-featureide plugin configuration
#
# This file is read every time the plugin starts.
# Edit the values below, then restart Eclipse to apply changes.
# The file is also updated automatically when you confirm the
# "Configure SysML v2 Repository" dialog.

# URL of the Flask middleware server
sysml_api.flask_url=http://127.0.0.1:5000

# URL of the SysML v2 API repository server
sysml_api.repo_url=http://sysml2.intercax.com:9000

# Number of elements fetched per page when querying the SysML v2 repository.
# Increase for large repositories.
sysml_api.page_size=512
